<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioVoice AI - Clean Audio</title>
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client;
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 480px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 8px; color: #38bdf8; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 25px 15px; cursor: pointer; background: #0f172a; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 13px; color: #fbbf24; min-height: 20px; }
        .result-box { margin-top: 20px; display: none; background: #0f172a; padding: 15px; border-radius: 10px; }
        audio { width: 100%; margin-top: 10px; }
        .download-btn { display: inline-block; margin-top: 10px; color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎙️ StudioVoice AI</h1>
    <p>अपनी आवाज़ से बैकग्राउंड शोर हटाएँ और HD बनाएँ</p>

    <div class="upload-area" onclick="document.getElementById('audioInput').click()">
        <span id="fileName">📂 ऑडियो फ़ाइल चुनें (MP3, WAV)</span>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <button id="enhanceBtn" class="btn" disabled>Clean & Enhance Voice</button>
    <div id="status" class="status"></div>

    <div id="resultBox" class="result-box">
        <h4 style="color: #4ade80;">✨ आवाज़ साफ़ हो चुकी है!</h4>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink" class="download-btn" download="clean_audio.wav">⬇️ Clean Audio डाउनलोड करें</a>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const fileName = document.getElementById('fileName');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;

    audioInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileName.innerText = selectedFile.name;
            enhanceBtn.disabled = false;
        }
    });

    enhanceBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        enhanceBtn.disabled = true;
        statusText.innerText = "⏳ AI से प्रोसेस हो रहा है... कृपया 30-40 सेकंड प्रतीक्षा करें";
        resultBox.style.display = "none";

        try {
            const app = await window.GradioClient.connect("ResembleAI/resemble-enhance");
            statusText.innerText = "⚡ बैकग्राउंड नॉइज़ हटाया जा रहा है...";
            
            const result = await app.predict("/predict", [
                selectedFile,
                "Midpoint",
                64,
                0.5,
                true
            ]);

            const enhancedAudioUrl = result.data[1].url;
            audioPlayer.src = enhancedAudioUrl;
            downloadLink.href = enhancedAudioUrl;
            resultBox.style.display = "block";
            statusText.innerText = "✅ काम पूरा हुआ!";
        } catch (error) {
            console.error(error);
            statusText.innerText = "❌ एरर: दोबारा प्रयास करें।";
        } finally {
            enhanceBtn.disabled = false;
        }
    });
</script>

</body>
</html>
