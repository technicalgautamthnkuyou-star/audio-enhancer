<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Studio Voice AI Tool - अपनी आवाज़ से हवा, पंखे का शोर और बैकग्राउंड नॉइज़ हटाएँ और 1 क्लिक में HD स्टूडियो क्वालिटी पाएँ।">
    <meta name="keywords" content="Studio Voice AI, Studio Voice AI tool, audiocleaner, technicalgautam, remove noise">

    <meta name="google-site-verification" content="NQX9OJfzT_O9w1DHwe_SnXOaoPk0O8Bq9WAyaOXTvWE" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #131c31; border: 1px solid #1e293b; border-radius: 20px; padding: 28px 20px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .logo-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
        .logo-box { width: 75px; height: 75px; background: linear-gradient(135deg, #1d4ed8, #7e22ce); border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); }
        .logo-box svg { width: 44px; height: 44px; fill: white; }
        h1 { font-size: 24px; margin-bottom: 6px; color: #38bdf8; font-weight: 700; letter-spacing: 0.5px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 22px; line-height: 1.5; }
        .upload-area { border: 2px dashed #334155; border-radius: 14px; padding: 24px 15px; cursor: pointer; background: #0b1120; margin-bottom: 18px; transition: border-color 0.2s; }
        .upload-area:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.2s; }
        .btn:hover:not(:disabled) { background: #0369a1; }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 13px; color: #38bdf8; min-height: 20px; font-weight: 500; }
        .result-box { margin-top: 20px; display: none; background: #0b1120; padding: 16px; border-radius: 12px; border: 1px solid #1e293b; }
        audio { width: 100%; margin-top: 12px; }
        .download-btn { display: inline-block; margin-top: 14px; background: #16a34a; color: white; padding: 11px 22px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 3px 10px; border-radius: 20px; font-size: 11px; margin-bottom: 8px; border: 1px solid rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-wrap">
        <div class="logo-box">
            <!-- Studio Voice AI Minimal Vector Logo -->
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                <rect x="1" y="10" width="2" height="4" rx="1"/>
                <rect x="21" y="10" width="2" height="4" rx="1"/>
                <rect x="19" y="8" width="1.5" height="8" rx="0.75" opacity="0.6"/>
                <rect x="3.5" y="8" width="1.5" height="8" rx="0.75" opacity="0.6"/>
            </svg>
        </div>
    </div>
    <span class="badge">AI Deep Audio Engine 2.0</span>
    <h1>Studio Voice AI</h1>
    <p>हवा, पंखा और बैकग्राउंड शोर को हटाकर आवाज़ को बनाएँ क्रिस्टल क्लियर स्टूडियो वोकल</p>

    <div class="upload-area" onclick="document.getElementById('audioInput').click()">
        <span id="fileName">📂 ऑडियो फ़ाइल चुनें (MP3, WAV, M4A)</span>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <button id="enhanceBtn" class="btn" disabled>Enhance to Studio Quality</button>
    <div id="status" class="status"></div>

    <div id="resultBox" class="result-box">
        <h4 style="color: #4ade80; font-size: 15px;">✨ ऑडियो प्रोसेस हो चुकी है!</h4>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink" class="download-btn" download="Studio_Clean_Audio.wav">⬇️ Clean Audio डाउनलोड करें</a>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const fileName = document.getElementById('fileName');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    let audioFile = null;

    audioInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            audioFile = e.target.files[0];
            fileName.innerText = "🎵 " + audioFile.name;
            enhanceBtn.disabled = false;
        }
    });

    enhanceBtn.addEventListener('click', async () => {
        if (!audioFile) return;

        enhanceBtn.disabled = true;
        statusText.innerText = "⏳ ऑडियो लोड हो रहा है...";
        resultBox.style.display = "none";

        try {
            const arrayBuffer = await audioFile.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            statusText.innerText = "⚡ डीप AI फ़िल्टरिंग और वॉइस क्लीयरेंस जारी है...";

            const offlineCtx = new OfflineAudioContext(
                decodedBuffer.numberOfChannels,
                decodedBuffer.length,
                decodedBuffer.sampleRate
            );

            const source = offlineCtx.createBufferSource();
            source.buffer = decodedBuffer;

            // 1. हाई-पास फ़िल्टर (हवा और पंखे की भारी थरथराहट को जड़ से साफ़ करना)
            const lowCut = offlineCtx.createBiquadFilter();
            lowCut.type = 'highpass';
            lowCut.frequency.value = 175;

            // 2. मिड-रेंज नॉइज़ सप्रेसर (कमरे की गूँज और खोखलेपन को कम करना)
            const midDamp = offlineCtx.createBiquadFilter();
            midDamp.type = 'peaking';
            midDamp.frequency.value = 450;
            midDamp.Q.value = 1.2;
            midDamp.gain.value = -3.5;

            // 3. वोकल क्लैरिटी और प्रेज़ेंस बूस्ट (2000Hz से 3500Hz पर आवाज़ को क्रिस्प और उभारना)
            const vocalPresence = offlineCtx.createBiquadFilter();
            vocalPresence.type = 'peaking';
            vocalPresence.frequency.value = 2400;
            vocalPresence.Q.value = 1.0;
            vocalPresence.gain.value = 4.5;

            // 4. हाई-एंड एयर लिफ़्ट (स्टूडियो जैसी चमक)
            const highAir = offlineCtx.createBiquadFilter();
            highAir.type = 'highshelf';
            highAir.frequency.value = 7500;
            highAir.gain.value = 2.5;

            // 5. स्टूडियो कंप्रेसर (आवाज़ के लेवल को एकदम एक समान और भारी रखना)
            const compressor = offlineCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-24, offlineCtx.currentTime);
            compressor.knee.setValueAtTime(10, offlineCtx.currentTime);
            compressor.ratio.setValueAtTime(4.5, offlineCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, offlineCtx.currentTime);
            compressor.release.setValueAtTime(0.18, offlineCtx.currentTime);

            source.connect(lowCut);
            lowCut.connect(midDamp);
            midDamp.connect(vocalPresence);
            vocalPresence.connect(highAir);
            highAir.connect(compressor);
            compressor.connect(offlineCtx.destination);

            source.start(0);

            statusText.innerText = "✨ बैकग्राउंड का शोर दबाया जा रहा है...";
            const renderedBuffer = await offlineCtx.startRendering();

            // 6. स्मार्ट नॉइज़ गेट (सन्नाटे के समय बैकग्राउंड नॉइज़ को 98% म्यूट करना)
            const gateThreshold = 0.040;
            for (let channel = 0; channel < renderedBuffer.numberOfChannels; channel++) {
                const data = renderedBuffer.getChannelData(channel);
                for (let i = 0; i < data.length; i++) {
                    if (Math.abs(data[i]) < gateThreshold) {
                        data[i] = data[i] * 0.03;
                    }
                }
            }

            const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
            const audioUrl = URL.createObjectURL(wavBlob);

            audioPlayer.src = audioUrl;
            downloadLink.href = audioUrl;
            resultBox.style.display = "block";
            statusText.innerText = "✅ Studio Voice AI द्वारा ऑडियो साफ़ कर दिया गया!";
        } catch (err) {
            console.error(err);
            statusText.innerText = "❌ फ़ाइल प्रोसेस करने में त्रुटि आई।";
        } finally {
            enhanceBtn.disabled = false;
        }
    });

    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            out = new DataView(new ArrayBuffer(length)),
            channels = [], i, sample, offset = 0, pos = 0;

        function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952);
        setUint32(length - 8);
        setUint32(0x45564157);
        setUint32(0x20746d66);
        setUint32(16);
        setUint16(1);
        setUint16(numOfChan);
        setUint32(abuffer.sampleRate);
        setUint32(abuffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2);
        setUint16(16);
        setUint32(0x61746164);
        setUint32(length - pos - 4);

        for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

        while (offset < len) {
            for (i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                out.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([out.buffer], { type: "audio/wav" });
    }
</script>

</body>
</html>
